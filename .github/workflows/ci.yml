name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: deno check supabase/functions/usda-search/index.ts

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase db start
      - run: supabase test db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Throwaway local stack (auth + REST + Postgres with our migrations).
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - name: Build the web app against the local stack
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          EXPO_PUBLIC_SUPABASE_URL="$API_URL" EXPO_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" npm run export:web -w @hfn/mobile
          # The USDA journey seeds the local catalog with the local service-role key.
          echo "E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "E2E_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The Electron shell over the same export: auth from the app:// origin and session persistence.
      - name: Desktop shell smoke test
        env:
          DESKTOP_E2E_AUTH: "1"
        run: |
          npm run build -w @hfn/desktop
          xvfb-run -a npm run test:smoke -w @hfn/desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            apps/desktop/playwright-report
            apps/desktop/test-results

  # Windows spike: build the Store package and check it on a real Windows runner.
  # See docs/decisions/0001-windows-desktop-packaging.md.
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the web app
        # No backend here: the smoke tests only need the bundle to load.
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run export:web -w @hfn/mobile
      - name: Build the AppX package
        run: npm run dist:win -w @hfn/desktop
      - name: Smoke-test the packaged app
        env:
          HFN_DESKTOP_EXECUTABLE: ${{ github.workspace }}\apps\desktop\release\win-unpacked\HFN.exe
        run: npm run test:smoke -w @hfn/desktop
      - name: Check the AppX manifest
        shell: pwsh
        run: |
          $appx = Get-ChildItem apps/desktop/release/*.appx | Select-Object -First 1
          if (-not $appx) { throw "No .appx was built" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($appx.FullName)
          $reader = New-Object IO.StreamReader($zip.GetEntry("AppxManifest.xml").Open())
          $manifest = $reader.ReadToEnd()
          $reader.Dispose(); $zip.Dispose()
          Write-Output $manifest
          if ($manifest -notmatch '<uap:Protocol Name="hfn">') { throw "The hfn: protocol is missing from the manifest" }
          if ($manifest -notmatch 'EntryPoint="Windows.FullTrustApplication"') { throw "Expected a full-trust desktop app" }
      - name: Install the package and open an hfn link
        # The Store re-signs uploads; this throwaway certificate only lets the runner install a copy.
        shell: pwsh
        run: |
          $publisher = "CN=00000000-0000-0000-0000-000000000000"
          $appx = Get-ChildItem apps/desktop/release/*.appx | Select-Object -First 1
          $signed = Join-Path $env:RUNNER_TEMP "hfn-signed.appx"
          Copy-Item $appx.FullName $signed
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName "HFN CI" `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfxPassword = ConvertTo-SecureString -String "ci" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\hfn-ci.pfx" -Password $pfxPassword | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\hfn-ci.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\hfn-ci.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\hfn-ci.pfx" /p ci $signed
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

          Add-AppxPackage -Path $signed
          $package = Get-AppxPackage -Name "HFN.HealthFitnessNutrition"
          if (-not $package) { throw "The package did not install" }
          Write-Output "Installed $($package.PackageFullName) at $($package.InstallLocation)"

          # Protocol activation goes through the manifest's windows.protocol extension.
          Start-Process "hfn://sign-in"
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 2
            $running = Get-Process -Name HFN -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$($package.InstallLocation)*" }
          } until ($running -or (Get-Date) -gt $deadline)
          if (-not $running) { throw "Opening hfn://sign-in did not start the packaged app" }
          Write-Output "hfn: link started $($running[0].Path)"
          $running | Stop-Process -Force
          Remove-AppxPackage -Package $package.PackageFullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-windows
          path: |
            apps/desktop/release/*.appx
            apps/desktop/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore
