# Windows packaging for the Microsoft Store. See docs/decisions/0001-windows-desktop-packaging.md.
appId: app.hfn.desktop
productName: HFN
executableName: HFN
# No auto-update feed: the Store delivers updates.
publish: null
directories:
  output: release
  buildResources: build-resources
files:
  - out/**/*
  - package.json
# The Expo web export (apps/mobile/dist) ships next to the app as resources/web.
extraResources:
  - from: ../mobile/dist
    to: web
# Declared as a windows.protocol extension in the AppX manifest.
protocols:
  - name: Health Fitness Nutrition
    schemes: [hfn]
win:
  target: [appx]
  icon: ../mobile/assets/icon.png
appx:
  # Placeholders: replace with the values from Partner Center > Product identity before the
  # first Store upload. Values are case-sensitive and must match exactly.
  identityName: HFN.HealthFitnessNutrition
  publisher: CN=00000000-0000-0000-0000-000000000000
  publisherDisplayName: Health Fitness Nutrition
  applicationId: HFN
  displayName: Health Fitness Nutrition
  backgroundColor: "#E6F4FE"
  languages: [en-US]
